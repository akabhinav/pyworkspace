version: "3.9"

services:
  pyworkspace-api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
      minio:
        condition: service_started
      pysandbox:
        condition: service_healthy
      pygate:
        condition: service_healthy
      pymem:
        condition: service_healthy
    volumes:
      - ./workspace_templates:/app/workspace_templates:ro
      - ./examples/plugin-manifests:/etc/pyworkspace/plugins:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://pyworkspace:pyworkspace@postgres:5432/pyworkspace
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - VAULT_ADDR=http://vault:8200
      - MINIO_ENDPOINT=minio:9000
      - PLUGIN_MANIFEST_DIR=/etc/pyworkspace/plugins
      - PLUGIN_DISCOVERY_URLS=http://pysandbox:8080/plugin/manifest,http://pygate:8443/plugin/manifest,http://pymem:8090/plugin/manifest

  pyworkspace-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    depends_on:
      pyworkspace-api:
        condition: service_started
    environment:
      - PYWORKSPACE_API_URL=http://pyworkspace-api:8080/v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  pyworkspace-worker:
    build: .
    command: celery -A pyworkspace.worker worker --loglevel=info -c 4
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://pyworkspace:pyworkspace@postgres:5432/pyworkspace
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - VAULT_ADDR=http://vault:8200

  pyworkspace-beat:
    build: .
    command: celery -A pyworkspace.worker beat --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pyworkspace
      POSTGRES_USER: pyworkspace
      POSTGRES_PASSWORD: pyworkspace
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyworkspace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: server -dev
    ports:
      - "8200:8200"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Plugin services
  pysandbox:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN_REPO: https://github.com/akabhinav/plugin-pysandbox.git
        PLUGIN_PKG: pysandbox
    ports:
      - "8081:8080"
    environment:
      - PYSANDBOX_PORT=8080
      - PYSANDBOX_API_KEY=sandbox-dev-key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  pygate:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN_REPO: https://github.com/akabhinav/plugin-pygate.git
        PLUGIN_PKG: pygate
    ports:
      - "8443:8443"
    environment:
      - PYGATE_PORT=8443
      - PYGATE_API_KEY=pygate-dev-key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pymem:
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        PLUGIN_REPO: https://github.com/akabhinav/plugin-pymem.git
        PLUGIN_PKG: pymem
    ports:
      - "8090:8090"
    environment:
      - PYMEM_PORT=8090
      - PYMEM_API_KEY=pymem-dev-key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/v1/documents"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  pgdata:
  minio_data:
  grafana_data:
