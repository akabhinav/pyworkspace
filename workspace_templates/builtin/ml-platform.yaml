name: ml-platform
display_name: "ML Platform"
description: "Machine learning platform with Jupyter, MinIO, PostgreSQL, and Redis"
category: ml
services:
  - name: jupyter
    type: jupyter
    expose_port: true
  - name: postgres
    type: postgres
    config: {db: ml_metadata}
  - name: redis
    type: redis
  - name: minio
    type: minio
    config:
      buckets: [datasets, models, experiments, artifacts]
  - name: prometheus
    type: prometheus
  - name: grafana
    type: grafana
    depends_on: [prometheus]
