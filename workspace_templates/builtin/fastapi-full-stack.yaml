name: fastapi-full-stack
display_name: "FastAPI Full Stack"
description: "FastAPI + PostgreSQL + Redis + Kafka + MinIO + Monitoring"
category: backend
services:
  - name: postgres
    type: postgres
    version: "16"
    config:
      db: app_db
      extensions: [uuid-ossp, pgcrypto]
  - name: redis
    type: redis
    version: "7"
  - name: kafka
    type: kafka
  - name: minio
    type: minio
    config:
      buckets: [uploads, avatars, exports]
  - name: prometheus
    type: prometheus
  - name: grafana
    type: grafana
    depends_on: [prometheus]
  - name: jaeger
    type: jaeger
agent:
  initial_prompt: |
    You have a full FastAPI stack available with PostgreSQL, Redis, Kafka, MinIO, and monitoring.
    Build whatever the user describes next.
