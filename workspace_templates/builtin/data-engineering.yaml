name: data-engineering
display_name: "Data Engineering Platform"
description: "Kafka + PostgreSQL + ClickHouse + MinIO + Jupyter + Monitoring"
category: data
services:
  - name: kafka
    type: kafka
    config:
      topics:
        - {name: raw.events, partitions: 6}
        - {name: processed.events, partitions: 3}
  - name: postgres
    type: postgres
    config:
      db: metastore
  - name: clickhouse
    type: clickhouse
    config:
      db: analytics
  - name: minio
    type: minio
    config:
      buckets: [raw, silver, gold, checkpoints]
  - name: redis
    type: redis
  - name: jupyter
    type: jupyter
    expose_port: true
  - name: prometheus
    type: prometheus
  - name: grafana
    type: grafana
    depends_on: [prometheus]
