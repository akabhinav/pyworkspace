name: spring-boot-enterprise
display_name: "Spring Boot Enterprise"
description: "Full Spring Boot stack — PostgreSQL, Redis, Kafka, Elasticsearch, LocalStack"
category: backend
services:
  - name: postgres
    type: postgres
    version: "16"
    config:
      db: app_db
      extensions: [uuid-ossp, pgcrypto, pg_trgm]
  - name: redis
    type: redis
    version: "7"
    config:
      mode: standalone
      maxmemory: "512mb"
  - name: kafka
    type: kafka
    version: "7.5"
    config:
      topics:
        - {name: "app.events", partitions: 3, retention_ms: 604800000}
        - {name: "app.dlq", partitions: 1}
  - name: elasticsearch
    type: elasticsearch
    version: "8.11.0"
    config:
      heap: "512m"
  - name: localstack
    type: localstack
    config:
      services: [s3, sqs, sns, secretsmanager, ses]
      buckets: [uploads, processed]
  - name: prometheus
    type: prometheus
  - name: grafana
    type: grafana
    depends_on: [prometheus]
agent:
  initial_prompt: |
    You have a full Spring Boot enterprise stack available.
    PostgreSQL, Redis, Kafka, Elasticsearch, and AWS-compatible services are all running.
    Build whatever the user describes next.
