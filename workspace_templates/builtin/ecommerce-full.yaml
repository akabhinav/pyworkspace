name: ecommerce-full
display_name: "E-Commerce Full Stack"
description: "Complete e-commerce platform with multiple databases, messaging, and search"
category: fullstack
services:
  - name: postgres
    type: postgres
    config: {db: ecommerce}
  - name: mongodb
    type: mongodb
    config: {db: catalog}
  - name: redis
    type: redis
  - name: elasticsearch
    type: elasticsearch
  - name: kafka
    type: kafka
  - name: rabbitmq
    type: rabbitmq
  - name: localstack
    type: localstack
    config:
      services: [s3, sqs, sns, ses, lambda]
  - name: neo4j
    type: neo4j
    config: {heap_max: "1g"}
  - name: prometheus
    type: prometheus
  - name: grafana
    type: grafana
    depends_on: [prometheus]
  - name: jaeger
    type: jaeger
